  <title id="titulo">Pasos para amarrar los cordones</title>
  <desc id="descripcion">Tres ilustraciones muestran el nudo base, dos bucles cruzados y el lazo terminado.</desc>
  <rect width="760" height="360" rx="28" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#183153">
    <text x="380" y="48" font-size="25" font-weight="700">El método de las orejitas</text>
    <text x="125" y="310" font-size="18" font-weight="700">1. Nudo base</text>
    <text x="380" y="310" font-size="18" font-weight="700">2. Cruza los bucles</text>
    <text x="635" y="310" font-size="18" font-weight="700">3. Ajusta el lazo</text>
  </g>
