  <title id="titulo">Seis galletas repartidas en dos platos</title>
  <desc id="descripcion">Dos platos contienen tres galletas cada uno. Seis dividido entre dos es igual a tres.</desc>
  <rect width="760" height="360" rx="28" fill="#fff"/>
